name: Standalone app
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:setup
      - run: node --import tsx --test tests/*.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:standalone:browser
      - run: docker build -t tp-approval-check .
