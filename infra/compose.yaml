name: tp-approval-dev
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: tp_approval
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tp_approval"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
