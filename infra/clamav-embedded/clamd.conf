# Встроенный сканер TP_Approval: только loopback, вызывается API через INSTREAM.
Foreground false
User clamav
DatabaseDirectory /data/clamav
PidFile /run/clamav/clamd.pid
LogTime true
TCPSocket 3310
TCPAddr 127.0.0.1
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 200M
ConcurrentDatabaseReload no
